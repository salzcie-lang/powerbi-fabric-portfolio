<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File Intake Automation</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1600px; height: 1200px; text-align: center; padding-top: 86px; }
  .badge { font-size: 30px; padding: 12px 30px; }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: 40px; }
  .sub { font-size: 40px; font-weight: 500; color: var(--violet); margin-top: 30px; }
  .sub i { font-style: normal; color: #b3aee6; margin: 0 14px; }
  .hero { position: absolute; left: 50%; top: 470px; width: 1240px; transform: translateX(-50%); border-radius: 26px; overflow: hidden;
          border: 2px solid rgba(91,79,214,0.55); box-shadow: 0 40px 100px rgba(15,23,42,0.28), 0 0 80px rgba(31,94,255,0.18); z-index: 3; }
  .hero img, .side img { display: block; width: 100%; }
  .side { position: absolute; top: 560px; width: 980px; border-radius: 18px; overflow: hidden; opacity: 0.5; z-index: 1;
          border: 1px solid rgba(15,23,42,0.12); box-shadow: 0 30px 70px rgba(15,23,42,0.2); }
  .side.l { left: -800px; }
  .side.r { right: -800px; }

  .canvas.wide { width: 1920px; height: 1080px; padding-top: 64px; }
  .wide h1 { font-size: 92px; margin-top: 30px; }
  .wide .sub { font-size: 34px; margin-top: 22px; }
  .wide .badge { font-size: 26px; }
  .wide .hero { top: 400px; width: 1250px; }
  .wide .side { top: 470px; width: 1000px; }
  .wide .side.l { left: -690px; }
  .wide .side.r { right: -690px; }
</style>
</head>
<body>
<div class="canvas {{COVER_CLASS}}">
  <span class="badge">POWER AUTOMATE</span>
  <h1>File Intake Automation</h1>
  <div class="sub">Routing<i>·</i>Quarantine<i>·</i>Alerts<i>·</i>Pipeline hand-off</div>
  <div class="side l"><img src="../screenshots/01_router_run.png"></div>
  <div class="side r"><img src="../screenshots/03_outbox_run.png"></div>
  <div class="hero"><img src="../exports/02 Architecture.png"></div>
</div>
</body>
</html>
